---
# ══════════════════════════════════════════════════════════════════════════════
# Clone or update the hermes-agent repository
# Clones the branch, then checks out the pinned release tag.
# ══════════════════════════════════════════════════════════════════════════════

- name: Check if repository already exists
  ansible.builtin.stat:
    path: "{{ _hermes_install_dir }}/.git"
  register: _hermes_repo_stat

# ── Fresh clone ──────────────────────────────────────────────────────────────

- name: Clone hermes-agent repository (shallow)
  ansible.builtin.git:
    repo: "{{ hermes_repo_url }}"
    dest: "{{ _hermes_install_dir }}"
    version: "{{ hermes_branch }}"
    depth: 1
    force: true
  become: true
  become_user: "{{ _hermes_mise_user }}"
  when: not _hermes_repo_stat.stat.exists
  register: _hermes_clone
  notify: Remove existing venv

# ── Checkout release tag ─────────────────────────────────────────────────────

- name: Checkout release tag {{ hermes_release_tag }}
  ansible.builtin.git:
    repo: "{{ hermes_repo_url }}"
    dest: "{{ _hermes_install_dir }}"
    version: "{{ hermes_release_tag }}"
    depth: 1
    force: true
  become: true
  become_user: "{{ _hermes_mise_user }}"
  register: _hermes_tag_checkout
  when:
    - hermes_release_tag | length > 0
    - _hermes_clone is changed or not _hermes_repo_stat.stat.exists

# ── Update existing repository ───────────────────────────────────────────────

- name: Update existing repository
  when:
    - _hermes_repo_stat.stat.exists | default(false) | bool
    - hermes_release_tag | length == 0
  block:
    - name: Fetch latest changes
      ansible.builtin.git:
        repo: "{{ hermes_repo_url }}"
        dest: "{{ _hermes_install_dir }}"
        version: "{{ hermes_branch }}"
        depth: 1
        force: true
      become: true
      become_user: "{{ _hermes_mise_user }}"
      register: _hermes_fetch

# ── Pin to specific commit (overrides tag) ───────────────────────────────────

- name: Pin to specific commit
  ansible.builtin.git:
    repo: "{{ hermes_repo_url }}"
    dest: "{{ _hermes_install_dir }}"
    version: "{{ hermes_commit }}"
    depth: 1
    force: true
  become: true
  become_user: "{{ _hermes_mise_user }}"
  when: hermes_commit | length > 0
  register: _hermes_commit_checkout

# ── Fix ownership ────────────────────────────────────────────────────────────

- name: Ensure correct ownership of repo
  ansible.builtin.file:
    path: "{{ _hermes_install_dir }}"
    state: directory
    owner: "{{ _hermes_mise_user }}"
    group: "{{ _hermes_mise_user }}"
    recurse: true
  when: _hermes_clone is changed or _hermes_tag_checkout is changed
